<svg class="arch" viewBox="0 0 830 320" role="img" aria-label="Marginborn architecture: the device holds the keys; sync and storage see user content only as ciphertext; the AI path sees plaintext">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>

  {% comment %}On the device{% endcomment %}
  <rect class="zone" x="10" y="20" width="270" height="290" rx="10"/>
  <text x="22" y="40" class="lbl">ON THE DEVICE (holds the keys)</text>
  <rect class="box" x="25" y="52" width="75" height="36" rx="6"/><text x="62" y="75" text-anchor="middle">iOS</text>
  <rect class="box" x="107" y="52" width="75" height="36" rx="6"/><text x="144" y="75" text-anchor="middle">Android</text>
  <rect class="box" x="189" y="52" width="75" height="36" rx="6"/><text x="226" y="75" text-anchor="middle">Web</text>
  <a href="/one-encryption-core/">
    <rect class="key" x="25" y="110" width="239" height="54" rx="6"/>
    <text x="144" y="132" text-anchor="middle">braird-core (Rust)</text>
    <text x="144" y="150" text-anchor="middle" class="sub">AES-GCM-256 · Swift, Kotlin, WASM</text>
  </a>
  <a href="/offline-sync/">
    <rect class="box" x="25" y="186" width="239" height="54" rx="6"/>
    <text x="144" y="208" text-anchor="middle">Offline-first store + outbox</text>
    <text x="144" y="226" text-anchor="middle" class="sub">edits work offline, sync later</text>
  </a>
  <line x1="144" y1="88" x2="144" y2="108" marker-end="url(#ah)"/>
  <line x1="144" y1="164" x2="144" y2="184" marker-end="url(#ah)"/>

  {% comment %}Device to the cloud{% endcomment %}
  <line x1="266" y1="205" x2="353" y2="145" marker-end="url(#ah)"/>
  <text x="305" y="150" text-anchor="middle" class="lbl">content as</text>
  <text x="305" y="161" text-anchor="middle" class="lbl">ciphertext</text>
  <line x1="282" y1="275" x2="353" y2="262" marker-end="url(#ah)"/>
  <text x="312" y="292" text-anchor="middle" class="lbl">plaintext</text>

  {% comment %}Sync and storage{% endcomment %}
  <rect class="zone" x="340" y="20" width="260" height="160" rx="10"/>
  <text x="352" y="40" class="lbl">SYNC AND STORAGE (user content as ciphertext)</text>
  <rect class="box" x="355" y="52" width="230" height="50" rx="6"/>
  <text x="470" y="72" text-anchor="middle">Supabase</text>
  <text x="470" y="90" text-anchor="middle" class="sub">Postgres with row-level security, auth, storage</text>
  <rect class="box" x="355" y="118" width="230" height="50" rx="6"/>
  <text x="470" y="138" text-anchor="middle">Edge Functions</text>
  <text x="470" y="156" text-anchor="middle" class="sub">sync, metering, event allowlist</text>
  <line x1="470" y1="118" x2="470" y2="104" marker-end="url(#ah)"/>

  {% comment %}AI path{% endcomment %}
  <rect class="warn" x="340" y="200" width="260" height="110" rx="10"/>
  <text x="352" y="220" class="lbl">AI PATH (sees plaintext the user sends)</text>
  <rect class="key" x="355" y="234" width="230" height="54" rx="6"/>
  <text x="470" y="256" text-anchor="middle">AI proxy</text>
  <text x="470" y="274" text-anchor="middle" class="sub">holds the API key · guardrails on input and output</text>

  {% comment %}Third parties{% endcomment %}
  <text x="650" y="40" class="lbl">THIRD PARTIES</text>
  <rect class="box" x="650" y="52" width="170" height="40" rx="6"/><text x="735" y="77" text-anchor="middle">Stripe hosted pages</text>
  <a href="/analytics-with-consent/">
    <rect class="box" x="650" y="123" width="170" height="40" rx="6"/><text x="735" y="148" text-anchor="middle">PostHog EU</text>
  </a>
  <a href="/evals-before-model-choice/">
    <rect class="box" x="650" y="234" width="170" height="54" rx="6"/><text x="735" y="256" text-anchor="middle">Claude models</text><text x="735" y="273" text-anchor="middle" class="sub">+ Azure Content Safety</text>
  </a>
  <line x1="587" y1="143" x2="648" y2="143" marker-end="url(#ah)"/>
  <line x1="587" y1="261" x2="648" y2="261" marker-end="url(#ah)"/>
</svg>
